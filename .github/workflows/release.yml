name: Build and publish TV update

# Single-repository publishing: the source repository is public, so a tag here produces the
# release that the TV client reads from `releases/latest/download/update.json`. No mirror
# repository is involved. The former cross-repository sync (kotlin-public-sync.yml) is retired.
on:
  push:
    tags: ['kotlin-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, for example kotlin-v0.9.10'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: tv-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Resolve version, guard monotonicity, restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.HONGGUOTV_KEYSTORE_B64 }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          version="${tag#kotlin-v}"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::tag '$tag' must look like kotlin-vX.Y.Z"; exit 1
          fi
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
          if (( 10#$minor > 999 || 10#$patch > 999 )); then
            echo "::error::minor and patch must stay below 1000"; exit 1
          fi
          code=$(( 10#$major * 1000000 + 10#$minor * 1000 + 10#$patch ))

          # The TV client only offers an update when versionCode is strictly greater than the
          # installed one, so a tag that is not newer than the newest published kotlin-v
          # release must never ship. The comparison is against *every* published kotlin-v
          # release, not against the one that happens to hold the `latest` pointer: that
          # pointer also serves the non-kotlin v* releases of the RN client, and a tag
          # published while it points at one of those used to skip this guard completely.
          if ! published_tags="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isDraft --jq '.[] | select(.isDraft == false) | .tagName')"; then
            echo "::error::could not list the published releases; refusing to publish without a version comparison"; exit 1
          fi
          published_versions=""
          while IFS= read -r published_tag; do
            [[ -n "$published_tag" ]] || continue
            case "$published_tag" in
              kotlin-v*) published_version="${published_tag#kotlin-v}" ;;
              *) continue ;;
            esac
            [[ "$published_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            published_versions+="$published_version"$'\n'
          done <<< "$published_tags"
          newest_published="$(printf '%s' "$published_versions" | sort -V | tail -n1)"
          if [[ -n "$newest_published" ]]; then
            if [[ "$version" == "$newest_published" ]]; then
              echo "::error::kotlin-v$version already exists; publish a higher version"; exit 1
            elif [[ "$(printf '%s\n%s\n' "$newest_published" "$version" | sort -V | head -n1)" != "$newest_published" ]]; then
              echo "::error::kotlin-v$version is not newer than the newest published kotlin-v$newest_published"; exit 1
            fi
          fi

          echo "::notice::tag=$tag versionName=$version versionCode=$code"
          test -n "$KEYSTORE_B64" || { echo "::error::HONGGUOTV_KEYSTORE_B64 is not configured"; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "HONGGUOTV_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "HONGGUOTV_VERSION_CODE=$code"
            echo "HONGGUOTV_VERSION_NAME=$version"
            echo "UPDATE_TAG=$tag"
          } >> "$GITHUB_ENV"

          # Per-version release notes, when the repository has them. The block between the
          # markers is what the television shows when it offers this version; the whole
          # document is the release page body. Without this file every release carried the
          # same generic sentence, so the update dialog said nothing about what changed.
          notes_file="kotlin-tv/RELEASE_${version}.md"
          if [[ -f "$notes_file" ]]; then
            echo "RELEASE_NOTES_FILE=$notes_file" >> "$GITHUB_ENV"
            short_notes="$(awk '/^<!-- notes -->/{flag=1;next}/^<!-- \/notes -->/{flag=0}flag' "$notes_file")"
            if [[ -n "$short_notes" ]]; then
              {
                echo "RELEASE_NOTES<<RELEASE_NOTES_EOF"
                printf '%s\n' "$short_notes"
                echo "RELEASE_NOTES_EOF"
              } >> "$GITHUB_ENV"
            fi
          else
            echo "::warning::no per-version notes at $notes_file; the update dialog will carry the generic text"
          fi

      - name: Tests, release lint, and signed APK
        env:
          HONGGUOTV_STORE_PASSWORD: ${{ secrets.HONGGUOTV_STORE_PASSWORD }}
          HONGGUOTV_KEY_ALIAS: ${{ secrets.HONGGUOTV_KEY_ALIAS }}
          HONGGUOTV_KEY_PASSWORD: ${{ secrets.HONGGUOTV_KEY_PASSWORD }}
        run: ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --console=plain

      - name: Publish APK, source, and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-tv-update.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tv-update-verification
          path: |
            kotlin-tv/core/build/reports/tests/test/
            kotlin-tv/app/build/reports/tests/testDebugUnitTest/
            kotlin-tv/app/build/reports/lint-results-release.*
            outputs/update.json

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
