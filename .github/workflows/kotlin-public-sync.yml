name: Deprecated - cross-repository native source sync

# Retired 2026-10-17. The source repository is now public, so the TV release is produced from
# this same repository by release.yml; no mirror repository is involved any more.
# scripts/sync-kotlin-public.py still targets N3urda/hongguoTV-updates, which has never had a
# single release, and the deploy key it expects (TV_UPDATES_DEPLOY_KEY) grants write access to
# that same unused repository.
#
# To restore the old two-repository flow instead, create a dedicated PUBLIC update repository,
# change the allow-list in scripts/sync-kotlin-public.py, point AppUpdates.REPOSITORY at it, and
# configure TV_UPDATES_DEPLOY_KEY plus the TV_UPDATES_ENABLED variable.
#
# This file is kept only so the previous flow stays readable and reversible; it deliberately
# fails instead of silently syncing to the wrong place.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain the retired flow
        run: |
          echo "::error::Cross-repository sync is retired. Push a kotlin-vX.Y.Z tag instead; release.yml builds, signs and publishes the update manifest that the TV reads."
          exit 1
