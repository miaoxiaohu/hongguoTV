name: Verify Kotlin standalone APK
# Verification only. Publishing lives in release.yml and is driven by a kotlin-vX.Y.Z tag, which
# already runs :core:test and :app:lintRelease as build gates, so tags no longer trigger this job.
on:
  push:
    branches: ['main']
  # The release scripts run in release.yml, and that workflow only starts once a tag is
  # pushed - by then the APK is built and signed. Listing them here gives a pull request a
  # chance to catch a broken version calculation, certificate check or asset upload before
  # it can reach a release.
  pull_request:
    paths:
      - 'kotlin-tv/**'
      - 'scripts/build-kotlin.sh'
      - 'scripts/publish-tv-update.py'
      - 'scripts/check-apk-version.py'
      - 'scripts/diff-apk-strings.py'
      - '.github/workflows/kotlin-native.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Release scripts parse
        run: python3 -m py_compile scripts/publish-tv-update.py scripts/check-apk-version.py scripts/diff-apk-strings.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests, Android lint, and installable development APK
        run: ./kotlin-tv/gradlew -p kotlin-tv :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kotlin-native-verification
          path: |
            kotlin-tv/core/build/reports/tests/test/
            kotlin-tv/app/build/reports/tests/testDebugUnitTest/
            kotlin-tv/app/build/reports/lint-results-debug.*
            kotlin-tv/app/build/outputs/apk/debug/*.apk
